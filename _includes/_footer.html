<footer id="footer-content" class="bg-grau">
  <div id="up-to-top" class="row">
    <div class="small-12 columns" style="text-align: right;">
      <a class="iconfont" href="#top-of-page">&#xf108;</a>
    </div><!-- /.small-12.columns -->
  </div>

  <div id="subfooter">
    <nav class="row">
      <section id="subfooter-left" class="small-12 medium-4 columns credits">
        {{ site.credits }}
      </section>

      <section id="subfooter-middle" class="small-12 medium-4 columns" style="height: 100%">

        <div style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 1rem; width: 100%; height: 100%">
          <a href="https://mac-csse-webring.vercel.app/#multipixels.dev/?nav=prev" style="color: inherit; text-decoration: none;" title="Previous site">←</a>
          <a href="https://mac-csse-webring.vercel.app/" style="line-height: 0;" title="McMaster CS & SE Webring">
            <img src="https://mac-csse-webring.vercel.app/assets/Uni_mcmaster_logo.svg.png" alt="McMaster CS & SE Webring" style="height: 24px; width: auto; display: block;">
          </a>
          <a href="https://mac-csse-webring.vercel.app/#multipixels.dev/?nav=next" style="color: inherit; text-decoration: none;" title="Next site">→</a>
        </div>

      </section>

      <section id="subfooter-right" class="small-12 medium-4 columns">
        <ul class="inline-list social-icons">
        {% for social_item in site.data.socialmedia %}
          <li><a href="{{ social_item.url }}" target="_blank" class="{{ social_item.class }}" title="{{ social_item.title }}"></a></li>
        {% endfor %}
        </ul>
      </section>
    </nav>
  </div><!-- /#subfooter -->
</footer>

<footer style="display: flex; position: absolute; bottom: 0; width: 100%">
  <img src="{{site.url}}/assets/svg/lotus.svg" style="margin:0px 10px 5px auto; width:35px; filter: invert(50%) sepia(0%) saturate(0%) hue-rotate(235deg) brightness(98%) contrast(88%);">
</footer>
